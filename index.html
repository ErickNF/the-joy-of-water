<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Joy of Water — New Mexico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header>
      <nav id="toggle">
        <button data-view="precipitation">PRECIPITATION</button>
        <span class="sep">/</span>
        <button data-view="snowpack">SNOWPACK</button>
        <span class="sep">/</span>
        <button data-view="streamflow">STREAMFLOW</button>
        <span class="sep">/</span>
        <button data-view="storage">STORAGE</button>
        <span class="sep">/</span>
        <button data-view="groundwater">GROUNDWATER</button>
        <span class="sep">/</span>
        <button data-view="otowi">OTOWI</button>
      </nav>
      <div id="labels-row">
        <button id="labels-toggle">LABELS</button>
        <span class="sep">·</span>
        <button id="map-toggle" class="on" title="Show a locator map of the sites">MAP</button>
        <span class="sep">·</span>
        <button id="svg-export" title="Download this view as an SVG file">EXPORT as SVG</button>
      </div>
      <p id="info"></p>
    </header>
    <svg id="plot" role="img" aria-label="Stacked ridgeline chart of New Mexico water data"></svg>
    <footer>
      <p id="sources"></p>
      <p id="credit">
        Inspired by the art created by Peter Saville for Joy Division’s 1979 album
        <em>Unknown Pleasures</em> (Factory Records). This visualization is based on a plot by
        Harold Craft of radio pulses from CP 1919, the first identified pulsar, discovered by
        Jocelyn Bell Burnell in 1967.
      </p>
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
